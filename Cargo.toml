[workspace]
members = [
    "silverscript-lang",
    "silverscript-abi",
    "silverscript-debug-artifact",
    "debugger/session",
    "debugger/cli",
]
exclude = ["tree-sitter"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "ISC"
authors = ["Kaspa developers"]
repository = ""
rust-version = "1.94.0"

[workspace.dependencies]
kaspa-consensus-core = "2.1.0"
kaspa-consensus = "2.1.0"
kaspa-addresses = "2.1.0"
kaspa-hashes = "2.1.0"
kaspa-muhash = "2.1.0"
kaspa-txscript = "2.1.0"
kaspa-txscript-zk-sdk = "2.1.0"
kaspa-txscript-errors = "2.1.0"
blake2b_simd = "1.0.2"
blake3 = "1.8.5"
faster-hex = "0.10"
indexmap = "2.7.0"
rand = "0.8.5"
secp256k1 = { version = "0.29.0", features = [
    "global-context",
    "rand-std",
    "serde",
] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
silverscript-lang = { path = "silverscript-lang" }
silverscript-abi = { path = "silverscript-abi" }
silverscript-debug-artifact = { path = "silverscript-debug-artifact" }
thiserror = "1.0.61"
